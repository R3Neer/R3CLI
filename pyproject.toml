[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "r3-cli"
version = "0.5.2"
description = "A shared visual language for R3Neer's command-line tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "R3Neer" }]
dependencies = ["rich>=14,<15"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/R3Neer/R3CLI"
Repository = "https://github.com/R3Neer/R3CLI"
Issues = "https://github.com/R3Neer/R3CLI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/r3_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "--basetemp=.pytest-tmp"]
