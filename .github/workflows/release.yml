name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY
      - run: python -m pip install build twine
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check installed wheel and bundled resources
        run: |
          python -m venv /tmp/r3cli-wheel
          /tmp/r3cli-wheel/bin/python -m pip install dist/*.whl
          /tmp/r3cli-wheel/bin/python - <<'PY'
          import io
          import argparse
          from importlib.metadata import version

          import r3_cli
          from r3_cli import ConsoleUI, R3ArgumentParser

          assert r3_cli.__version__ == version("r3-cli")
          assert isinstance(R3ArgumentParser().parse_args([]), argparse.Namespace)
          output = io.StringIO()
          ConsoleUI(colour="never", ascii=True, stdout=output).success("Ready")
          assert "Ready" in output.getvalue()
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/r3-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
