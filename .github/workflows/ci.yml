name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl pytest
      - run: python -c "import r3_cli; assert r3_cli.__version__ == '0.4.1'"
      - run: python -m pytest

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/build_powershell.py
      - name: Validate the packaged PowerShell adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./dist/powershell/R3CLI/R3CLI.psd1 | Out-Null
          ./tests/PowerShell.Contract.ps1 -ModulePath ./dist/powershell/R3CLI/R3CLI.psd1

  nushell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.115.1"
      - run: python scripts/build_nushell.py
      - name: Parse packaged Nushell adapter
        shell: nu {0}
        run: |
          let adapter = ($env.GITHUB_WORKSPACE | path join 'dist/nushell/r3cli/mod.nu')
          if not (nu-check $adapter) { error make { msg: 'Packaged Nushell adapter failed nu-check.' } }
      - name: Validate the packaged Nushell adapter
        shell: bash
        run: nu --no-config-file "$GITHUB_WORKSPACE/tests/Nushell.Contract.nu"
